<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Журнал студентов</title>
    <link rel="stylesheet" href="css/table.css"/>
</head>
<body>
    <h1>Список Студентов</h1>
    <table id="studentsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Возраст</th>
                <th>Номер Группы</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="studentsBody"></tbody>
        <tbody id="bodyTable"></tbody>
    </table>

    <h1>Список групп</h1>
    <table id="groupsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Название группы</th>
            </tr>
        </thead>
        <tbody id="groupsBody"></tbody>
    </table>
    <form id="createUserForm">
        <input type="hidden" id="studentId" />
        <label>
            *
            <input type="text" id="firstName" placeholder="Введите имя студента" />
        </label>
        <label>
            *
            <input type="text" id="lastName" placeholder="Введите фамилию студента" />
        </label>
        <label>
            *
            <input type="number" id="age" placeholder="Введите возраст студента" />
        </label>
        <label>
            *
            <input type="number" id="groupId" placeholder="Введите номер группы студента" />
        </label>
        <button type="button" onclick="SaveStudent()">Сохранить</button>
    </form>

    <h1>Найти студента по ID</h1>
    <div class="search-block">
        <input type="number" id="searchId" placeholder="Введите ID" />
        <button onclick="LoadStudentById()">Найти</button>
        <p id="studentResult"></p>
    </div>
    <div id="error" style="color:red"></div>
    <script src="js/root.js"></script>
    <script>

        LoadAllStudents();
        LoadGroups();
    </script>
</body>
</html>
